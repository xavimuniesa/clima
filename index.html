<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c0f">
<title>Tauler del temps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c0f; --card:#12151a; --screen:#0c0f13; --line:#252a32; --line2:#323843;
  --txt:#e9edf3; --mut:#8a93a2; --dimtxt:#3a414c;
  --sol:#ffb020; --fred:#4db2ff; --pluja:#2fd6c6; --vis:#b48cff; --ok:#5fd38a;
  --gap:clamp(10px,1.4vw,18px); --pad:clamp(14px,1.6vw,22px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html,body{background:var(--bg);color:var(--txt);font-family:'Barlow',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{min-height:100vh;min-height:100dvh;background:radial-gradient(1200px 600px at 50% -200px,#16202b 0%,var(--bg) 60%)}
.wrap{width:100%;max-width:1880px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
@media(min-width:600px){.wrap{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}}

/* Cerca */
.top{display:flex;gap:10px;margin-bottom:var(--gap);position:relative;z-index:10}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;height:46px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--txt);font:500 16px 'Barlow',sans-serif;padding:0 14px 0 42px;outline:none;transition:border-color .2s;-webkit-appearance:none;appearance:none}
.search input:focus{border-color:var(--fred)}
.search input::placeholder{color:var(--mut)}
.search .ico{position:absolute;left:13px;top:13px;width:20px;height:20px;stroke:var(--mut);fill:none;stroke-width:1.8}
.results{position:absolute;top:52px;left:0;right:0;background:#161a20;border:1px solid var(--line2);border-radius:14px;overflow:hidden auto;max-height:min(60vh,420px);display:none;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.results.open{display:block}
.res{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.res>div{min-width:0}
.res:last-child{border-bottom:0}
.res:hover,.res.act{background:#1f252e}
.res b{font-weight:600}
.res small{color:var(--mut);display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .cc{margin-left:auto;flex:none;font:500 12px 'Barlow Condensed';color:var(--mut);border:1px solid var(--line2);border-radius:6px;padding:2px 6px}
.res.none{color:var(--mut);cursor:default}
.gps{height:46px;min-width:46px;flex:none;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--mut);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;cursor:pointer;font:500 14px 'Barlow',sans-serif;transition:.2s}
.gps svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.gps.on{color:var(--fred);border-color:rgba(77,178,255,.45)}
.gps span{display:none}
@media(min-width:600px){.gps span{display:inline}}

/* Graella: mòbil 1 col · tauleta 2 col · escriptori 3 col */
.grid{display:grid;gap:var(--gap);grid-template-columns:minmax(0,1fr)}
.grid>*{min-width:0}
.col-now .card:last-child{display:flex;flex-direction:column;justify-content:center}
.col-now{display:grid;gap:var(--gap);align-content:start;grid-template-columns:minmax(0,1fr)}
@media(min-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.col-now{grid-column:1/-1;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
@media(min-width:1100px){.grid{grid-template-columns:clamp(300px,24vw,420px) minmax(0,1fr) minmax(0,1fr)}.col-now{grid-column:auto;grid-template-columns:minmax(0,1fr)}}

.card{background:var(--card);border:1px solid var(--line);border-radius:clamp(16px,1.6vw,22px);padding:var(--pad);min-width:0}
.loc{display:flex;align-items:flex-start;gap:10px}
.loc>div{min-width:0}
.loc svg{width:18px;height:18px;stroke:var(--fred);fill:none;stroke-width:1.8;margin-top:4px;flex:none}
.loc h1{font:600 clamp(19px,1.6vw,26px) 'Barlow',sans-serif;line-height:1.2;overflow-wrap:anywhere}
.loc p{color:var(--mut);font-size:clamp(13px,1vw,15px);margin-top:2px}
.alt{margin-left:auto;flex:none;display:flex;align-items:center;gap:6px;font:500 15px 'Barlow Condensed';color:var(--mut);border:1px solid var(--line2);border-radius:10px;padding:4px 9px;white-space:nowrap}
.alt svg{width:16px;height:16px;margin:0;stroke:var(--mut)}
.now{display:flex;align-items:center;gap:clamp(10px,1.2vw,18px);margin:clamp(12px,1.6vh,22px) 0}
.now .sky{width:clamp(62px,6vw,96px);aspect-ratio:1;flex:none}
.now .sky svg{width:100%;height:100%}
.now .t{font:300 clamp(60px,5.6vw,92px)/0.9 'Barlow Condensed',sans-serif;letter-spacing:-1px}
.now .t sup{font-size:.42em;vertical-align:top;margin-left:2px}
.now .d{font:500 clamp(16px,1.3vw,20px) 'Barlow',sans-serif;margin-top:6px}
.now .h{color:var(--mut);font-size:13px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--screen);border:1px solid var(--line);border-radius:14px;padding:9px 4px;text-align:center;min-width:0}
.stat small{display:block;color:var(--mut);font:500 clamp(11px,.85vw,13px) 'Barlow Condensed';letter-spacing:.8px;text-transform:uppercase}
.stat b{font:500 clamp(21px,1.8vw,28px) 'Barlow Condensed'}
.stat i{font-style:normal;font-size:13px;color:var(--mut)}
.mm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mm div{text-align:center}
.mm small{display:block;color:var(--mut);font:500 clamp(11px,.85vw,13px) 'Barlow Condensed';letter-spacing:.8px;text-transform:uppercase}
.mm b{font:400 clamp(38px,3.4vw,56px)/1.1 'Barlow Condensed'}
.mm .mx b{color:#ffc56b}.mm .mn b{color:#8fd0ff}
.sun{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 18px;color:var(--mut);font:500 14px 'Barlow Condensed';margin-top:10px;border-top:1px solid var(--line);padding-top:10px}

/* Taulers */
.panel{display:flex;flex-direction:column;background:linear-gradient(#1c2027,#14171c);border:1px solid var(--line2);border-radius:clamp(20px,2vw,28px);padding:clamp(6px,.7vw,10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 20px 40px rgba(0,0,0,.35);min-width:0}
.screen{flex:1;display:flex;flex-direction:column;background:var(--screen);border-radius:clamp(14px,1.4vw,20px);padding:clamp(12px,1.3vw,18px);border:1px solid #07090b;box-shadow:inset 0 2px 12px rgba(0,0,0,.7);min-height:0}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.ph h2{font:600 clamp(24px,2.2vw,34px) 'Barlow Condensed',sans-serif;letter-spacing:4px;color:#f3f6fa;text-shadow:0 0 12px rgba(120,190,255,.35)}
.ph span{color:var(--mut);font:500 clamp(14px,1.05vw,16px) 'Barlow Condensed';text-align:right}
.ph span::first-letter{text-transform:uppercase}
.strip{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{display:flex;align-items:center;gap:5px;background:#12161b;border:1px solid var(--line);border-radius:9px;padding:4px 8px;font:500 clamp(13px,1vw,15px) 'Barlow Condensed';color:#c9d0da;white-space:nowrap}
.chip svg{width:18px;height:18px;flex:none}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(5px,.6vw,9px)}
.slot{aspect-ratio:1/1;container-type:size;min-width:0;min-height:0;border-radius:clamp(10px,1.2vw,16px);background:radial-gradient(circle at 50% 40%,#12161b,#0a0c0f);border:1px solid #1b2027;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:default;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
.slot .sock{width:44cqmin;aspect-ratio:1;border-radius:50%;border:1px dashed #1f252d}
.slot svg{width:min(50cqw,46cqh);height:auto;flex:none;fill:none;stroke:var(--c);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--c) 70%,transparent))}
.slot svg .f{fill:var(--c)}
.slot label{font:500 clamp(9px,min(12.5cqw,13cqh),14px)/1.1 'Barlow Condensed',sans-serif;letter-spacing:.03em;text-transform:uppercase;color:var(--c);text-align:center;padding:0 3px;max-width:100%;pointer-events:none}
.slot label.lg{font-size:clamp(6px,min(9.2cqw,12cqh),13px);letter-spacing:0;padding:0 2px}
.slot.on{cursor:pointer;border-color:color-mix(in srgb,var(--c) 30%,#1b2027);background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--c) 14%,#10141a),#0a0c0f 75%);animation:ign .9s ease both}
.slot.on.sel{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
@keyframes ign{0%{opacity:.15;filter:brightness(.4)}35%{opacity:1;filter:brightness(1.7)}55%{filter:brightness(.8)}100%{opacity:1;filter:brightness(1)}}
.why{margin-top:10px;min-height:22px;color:var(--mut);font:500 clamp(14px,1.05vw,16px)/1.25 'Barlow Condensed';display:flex;align-items:center;gap:8px}
.why .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--ok));box-shadow:0 0 8px var(--c,var(--ok));flex:none}
.why.ok{color:var(--ok)}
.bottom{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 20px;margin-top:var(--gap)}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;color:var(--mut);font:500 13px 'Barlow Condensed';letter-spacing:.4px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.foot{text-align:center;color:var(--dimtxt);font:500 13px 'Barlow Condensed';letter-spacing:.5px}
.foot a{color:var(--mut)}
.err{color:#ff8a7a}

/* Escriptori: tot a una pantalla, sense scroll */
@media(min-width:1100px) and (min-height:640px){
  .wrap{height:100vh;height:100dvh;display:flex;flex-direction:column;padding-top:18px;padding-bottom:12px}
  .grid{flex:1;min-height:0;grid-template-rows:minmax(0,1fr)}
  .col-now{min-height:0;grid-template-rows:minmax(0,1.5fr) minmax(0,1fr)}
  .col-now .card{display:flex;flex-direction:column;justify-content:center;min-height:0}
  .now{margin:clamp(14px,3vh,40px) 0}
  .now .sky{width:clamp(70px,10vh,130px)}
  .now .t{font-size:clamp(64px,10vh,128px)}
  .mm b{font-size:clamp(40px,7vh,84px)}
  .stat b{font-size:clamp(22px,3.2vh,34px)}
  .slot{gap:clamp(4px,1vh,12px)}
  .panel,.screen{min-height:0}
  .slots{flex:1;min-height:0;grid-auto-rows:minmax(0,1fr)}
  .slot{aspect-ratio:auto}
}
/* Mòbil estret */
@media(max-width:380px){.slots{gap:5px}.chip{padding:3px 6px;font-size:13px}.ph h2{letter-spacing:3px}}
/* Mòbil apaïsat: dades a l'esquerra, taulers a la dreta amb scroll */
@media(max-height:500px) and (orientation:landscape) and (min-width:640px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .col-now{grid-column:1/-1;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="search">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="text" placeholder="Cerca una localitat del món…" autocomplete="off" spellcheck="false" aria-label="Cerca una localitat">
      <div class="results" id="res" role="listbox"></div>
    </div>
    <button class="gps on" id="gps" title="Tornar a la meva ubicació">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
      <span>La meva ubicació</span>
    </button>
  </div>

  <div class="grid">
    <div class="col-now">
      <div class="card">
        <div class="loc">
          <svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
          <div><h1 id="lname">Localitzant…</h1><p id="lreg">&nbsp;</p></div>
          <div class="alt" title="Alçada"><svg viewBox="0 0 24 24"><path d="M3 20L9.5 8l4 7 2.5-4L21 20Z"/></svg><span id="alt">– m</span></div>
        </div>
        <div class="now">
          <div class="sky" id="nsky"></div>
          <div>
            <div class="t" id="ntemp">–<sup>°</sup></div>
            <div class="d" id="ndesc">&nbsp;</div>
            <div class="h" id="nhour">&nbsp;</div>
          </div>
        </div>
        <div class="stats">
          <div class="stat"><small>Humitat</small><b id="nhum">–</b><i>%</i></div>
          <div class="stat"><small>Sensació</small><b id="nfeel">–</b><i>°</i></div>
          <div class="stat"><small>Vent</small><b id="nwind">–</b><i> km/h</i></div>
        </div>
      </div>
      <div class="card">
        <div class="mm">
          <div class="mx"><small>Màxima avui</small><b id="tmax">–°</b></div>
          <div class="mn"><small>Mínima avui</small><b id="tmin">–°</b></div>
        </div>
        <div class="sun"><span id="sunr">Sortida –</span><span id="suns">Posta –</span></div>
      </div>
    </div>

    <section class="panel" id="p0"><div class="screen">
      <div class="ph"><h2>AVUI</h2><span class="date"></span></div>
      <div class="strip"></div><div class="slots"></div><div class="why"></div>
    </div></section>

    <section class="panel" id="p1"><div class="screen">
      <div class="ph"><h2>DEMÀ</h2><span class="date"></span></div>
      <div class="strip"></div><div class="slots"></div><div class="why"></div>
    </div></section>
  </div>

  <div class="bottom">
    <div class="legend">
      <span><i style="background:var(--sol)"></i>Sol i calor</span>
      <span><i style="background:var(--fred)"></i>Fred i capes</span>
      <span><i style="background:var(--pluja)"></i>Pluja</span>
      <span><i style="background:var(--vis)"></i>Visibilitat i humitat</span>
    </div>
    <div class="foot" id="foot">Dades: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> · <a href="https://www.bigdatacloud.com" target="_blank" rel="noopener">BigDataCloud</a></div>
  </div>
</div>

<script>
/* ---------- Símbols ---------- */
const JK='M8 4L3 7L4 20H7L7.5 11V21H16.5V11L17 20H20L21 7L16 4';
const DROP=(x,y)=>`<path class="f" d="M${x} ${y}Q${x-1.4} ${y+2} ${x} ${y+3}Q${x+1.4} ${y+2} ${x} ${y}Z"/>`;
const ITEMS={
 ulleresSol:{f:'sol',n:'Ulleres de sol',s:'<path d="M2 9H22"/><path class="f" d="M3 9H10V11Q10 15 6.5 15Q3 15 3 11Z"/><path class="f" d="M14 9H21V11Q21 15 17.5 15Q14 15 14 11Z"/>'},
 gorra:{f:'sol',n:'Gorra',s:'<path d="M2 15Q2 7 9 7Q16 7 16 15Z"/><path d="M13 15H23Q22.5 17.5 19 17.5H13"/><path d="M9 7Q11 11 10 15"/><circle class="f" cx="9" cy="6.2" r="1"/>'},
 crema:{f:'sol',n:'Crema solar',s:'<rect x="9.5" y="2" width="5" height="3" rx=".5"/><path d="M7 5H17L15.5 21H8.5Z"/><circle cx="12" cy="12" r="2"/><path d="M12 8.3V9.2M12 14.8V15.7M8.4 12H9.3M14.7 12H15.6"/>'},
 aigua:{f:'sol',n:'Aigua extra',s:'<rect x="10" y="2" width="4" height="2"/><path d="M10 4V6L8 9V20Q8 21 9 21H15Q16 21 16 20V9L14 6V4"/><path d="M12 11Q9.5 14.5 10.2 16.5Q12 18.8 13.8 16.5Q14.5 14.5 12 11Z"/>'},
 estiu:{f:'sol',n:"Roba d'estiu",s:'<path d="M5 4H19L20 17H14L12 10L10 17H4Z"/><path d="M5 6.5H19"/>'},
 manigaLlarga:{f:'fred',n:'Màniga llarga',s:`<path d="${JK}"/><path d="M8 4Q12 7 16 4"/>`},
 tallavent:{f:'fred',n:'Tallavent',vb:'-4 0 28 24',s:`<path d="${JK}"/><path d="M8 4Q12 -1 16 4"/><path d="M12 4V21"/><path d="M-3 9H1M-3.5 13H2M-3 17H1"/>`},
 polar:{f:'fred',n:'Polar',s:`<path d="${JK}"/><path d="M9 4V2.5H15V4"/><path d="M12 2.5V8"/><circle class="f" cx="10" cy="13" r=".7"/><circle class="f" cx="14" cy="13" r=".7"/><circle class="f" cx="12" cy="16" r=".7"/><circle class="f" cx="10" cy="19" r=".7"/><circle class="f" cx="14" cy="19" r=".7"/>`},
 softshell:{f:'fred',n:'Softshell',s:`<path d="${JK}"/><path d="M8 4V1.5H16V4"/><path d="M12 1.5V21"/><path d="M13.5 12H15.5"/>`},
 termica:{f:'fred',n:'Tèrmica',s:`<path d="${JK}"/><path d="M8 4Q12 7 16 4"/><path d="M10 11Q11 12.5 10 14Q9 15.5 10 17"/><path d="M14 11Q15 12.5 14 14Q13 15.5 14 17"/>`},
 plomes:{f:'fred',n:'Plomes',s:'<path d="M8 3.5L2.5 6.5L3 20.5H7.5V11V21.5H16.5V11V20.5H21L21.5 6.5L16 3.5"/><path d="M8 3.5V1.5H16V3.5"/><path d="M12 10.5V18.5M8.5 12.5L15.5 16.5M8.5 16.5L15.5 12.5" stroke-width="1.4"/><path d="M11 11L12 12L13 11M11 18L12 17L13 18" stroke-width="1.2"/>'},
 bufanda:{f:'fred',n:'Bufanda',s:'<path d="M5 6Q12 11 19 6V9Q12 14 5 9Z"/><path d="M13 11L12 20H15.5L15.8 10.5"/><path d="M12.5 20V22M13.8 20V22M15 20V22"/>'},
 gorro:{f:'fred',n:"Gorro",s:'<path d="M5 16Q5 7 12 7Q19 7 19 16"/><rect x="4" y="15.5" width="16" height="4.5" rx="1.5"/><path d="M8 16V20M12 16V20M16 16V20"/><circle cx="12" cy="5" r="2"/>'},
 guants:{f:'fred',n:'Guants',s:'<path d="M8 21V10Q8 5 12 5Q16 5 16 10V12L18 10.5Q19.5 9.8 20 11.2L16.5 17V21Z"/><path d="M8 18H16.5"/>'},
 botes:{f:'fred',n:"Botes d'hivern",s:'<path d="M6 2H13V11Q13 12 14 12.5L19 14Q21.5 14.8 21.5 17.5V19H6Z"/><path d="M6 4Q9.5 5.2 13 4"/><path d="M11 6.5L13 7.5M11 9L13 10M11.5 11.5L13.5 12.5"/><path d="M5.5 19V21.5H11V20.5H14V21.5H22V19"/>'},
 passamuntanyes:{f:'fred',n:'Passamuntanyes',s:'<path d="M12 2Q20 2 20 11Q20 21 12 21Q4 21 4 11Q4 2 12 2Z"/><rect x="7" y="9" width="10" height="3.5" rx="1.75"/><circle class="f" cx="9.7" cy="10.75" r=".8"/><circle class="f" cx="14.3" cy="10.75" r=".8"/>'},
 capelina:{f:'pluja',n:'Capelina',s:'<path d="M9 5Q12 1 15 5L21 18Q12 21 3 18Z"/><path d="M9.5 5.5Q12 8 14.5 5.5"/>'+DROP(4,3)+DROP(20,3)},
 jaquetaImp:{f:'pluja',n:'Impermeable',s:'<path d="M8 5L3 8L4 21H7L7.5 12V22H16.5V12L17 21H20L21 8L16 5"/><path d="M8 5Q12 0 16 5"/><path d="M12 5V22"/>'+DROP(3,1)+DROP(21,1)},
 pantaloImp:{f:'pluja',n:'Pantaló imper.',s:'<path d="M6 3H18L19 21H14L12 9L10 21H5Z"/><path d="M6 5.5H18"/>'+DROP(8.3,12)+DROP(15.7,12)},
 funda:{f:'pluja',n:'Funda motxilla',s:'<rect x="6" y="7" width="12" height="14" rx="3"/><path d="M9.5 7V5Q12 3 14.5 5V7"/><path d="M8.5 14H15.5V18H8.5Z"/>'+DROP(3.5,3)+DROP(20.5,3)},
 ulleresVent:{f:'vis',n:'Ulleres de vent',s:'<path d="M3 9Q3 7 5 7H19Q21 7 21 9V14Q21 16 19 16H15L13 14H11L9 16H5Q3 16 3 14Z"/><path d="M1 11H3M21 11H23"/>'},
 frontal:{f:'vis',n:'Frontal',s:'<rect x="12" y="8" width="5" height="7" rx="1.5"/><path d="M12 9.5Q4 7 3 11.5Q4 16 12 13.5"/><path d="M19 8L23 6M19 11.5H23.5M19 15L23 17"/>'},
 armilla:{f:'vis',n:'Armilla reflect.',s:'<path d="M8 3L4 6V21H20V6L16 3L12 10Z"/><path d="M4 14H20M4 17.5H20" stroke-width="2.4"/>'},
 evitarCoto:{f:'vis',n:'Evita el cotó',s:'<circle cx="9" cy="10" r="3.2"/><circle cx="15" cy="10" r="3.2"/><circle cx="12" cy="14.5" r="3.2"/><path d="M12 17.7V22"/><path d="M3 3L21 21" stroke-width="2"/>'}
};
const FAM={sol:'var(--sol)',fred:'var(--fred)',pluja:'var(--pluja)',vis:'var(--vis)'};
const SLOTS=16;

/* ---------- Icones del cel ---------- */
const SUN='<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>';
const MOON='<path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5Z"/>';
const CLOUD='<path d="M7 19h10.5a4 4 0 0 0 .4-7.98A5.8 5.8 0 0 0 6.8 10 4.5 4.5 0 0 0 7 19Z"/>';
function sky(code,day){
  const c='#dfe6ef',a='#ffb020',m='#cfd8ff',b='#4db2ff';
  const up=`<g stroke="${c}" transform="translate(0,-3.5)">${CLOUD}</g>`;
  let s;
  if(code===0) s=day?`<g stroke="${a}">${SUN}</g>`:`<g stroke="${m}">${MOON}</g>`;
  else if(code<=2) s=`<g stroke="${day?a:m}" transform="translate(-2,-3) scale(.75)">${day?SUN:MOON}</g><g stroke="${c}" transform="translate(3,3) scale(.82)">${CLOUD}</g>`;
  else if(code===3) s=`<g stroke="${c}">${CLOUD}</g>`;
  else if(code===45||code===48) s=up+`<path stroke="${c}" d="M4 19h16M6 22h12"/>`;
  else if(code>=51&&code<=57) s=up+`<path stroke="${b}" d="M8 19v.5M12 20v.5M16 19v.5M10 22.5v.5M14 22.5v.5"/>`;
  else if((code>=61&&code<=67)||(code>=80&&code<=82)) s=up+`<path stroke="${b}" d="M8.5 18.5l-1.2 3.5M12.5 18.5l-1.2 3.5M16.5 18.5l-1.2 3.5"/>`;
  else if((code>=71&&code<=77)||code===85||code===86) s=up+`<path stroke="#fff" d="M8 19.5v2.4M6.8 20.7h2.4M13 19.5v2.4M11.8 20.7h2.4M17 19.5v2.4M15.8 20.7h2.4"/>`;
  else if(code>=95) s=up+`<path stroke="${a}" d="M13 16.5l-3 3.5h3l-2 3.5"/>`;
  else s=`<g stroke="${c}">${CLOUD}</g>`;
  return `<svg viewBox="-1 -1 26 26" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${s}</svg>`;
}
const DESC={0:'Cel serè',1:'Majoritàriament serè',2:'Algun núvol',3:'Cel cobert',45:'Boira',48:'Boira gebradora',51:'Plugim feble',53:'Plugim',55:'Plugim intens',56:'Plugim gelant',57:'Plugim gelant',61:'Pluja feble',63:'Pluja',65:'Pluja forta',66:'Pluja gelant',67:'Pluja gelant forta',71:'Neu feble',73:'Neu',75:'Neu forta',77:'Neu granulada',80:'Ruixats',81:'Xàfecs',82:'Xàfecs forts',85:'Ruixats de neu',86:'Ruixats de neu forts',95:'Tempesta',96:'Tempesta amb calamarsa',99:'Tempesta forta amb calamarsa'};
const I={drop:'<svg viewBox="0 0 24 24" fill="none" stroke="#4db2ff" stroke-width="1.7"><path d="M12 3Q6 10.5 6 14.5a6 6 0 0 0 12 0Q18 10.5 12 3Z"/></svg>',
 wind:'<svg viewBox="0 0 24 24" fill="none" stroke="#c9d0da" stroke-width="1.7" stroke-linecap="round"><path d="M3 9h11a3 3 0 1 0-3-3M3 15h15a3 3 0 1 1-3 3"/></svg>',
 uv:'<svg viewBox="0 0 24 24" fill="none" stroke="#ffb020" stroke-width="1.7" stroke-linecap="round">'+SUN+'</svg>'};

/* ---------- Utilitats ---------- */
const $=s=>document.querySelector(s);
const R=v=>Math.round(v);
const max=a=>a.length?Math.max(...a):null, min=a=>a.length?Math.min(...a):null, sum=a=>a.reduce((x,y)=>x+y,0);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const DEFAULT={lat:41.4969,lon:2.1575,name:'Ripollet',reg:'Catalunya, Espanya'};
let place=null, timer=null;

/* ---------- Mètriques d'un dia ---------- */
function metrics(d,di){
  const date=d.daily.time[di], nowH=+d.current.time.slice(11,13), H=d.hourly;
  const sel=(useNow)=>{const o=[];H.time.forEach((t,i)=>{if(!t.startsWith(date))return;const h=+t.slice(11,13);if(h<7||h>22)return;if(useNow&&h<nowH)return;o.push(i)});return o};
  let idx=sel(di===0); if(idx.length<4) idx=sel(false);
  const p=k=>idx.map(i=>H[k][i]).filter(v=>v!=null);
  const codes=p('weather_code'), temps=p('temperature_2m');
  const rhCold=idx.filter(i=>H.temperature_2m[i]<=12).map(i=>H.relative_humidity_2m[i]).filter(v=>v!=null);
  const vis=p('visibility');
  return {
    tMax:max(temps), fMin:min(p('apparent_temperature')), uv:max(p('uv_index'))||0,
    gust:max(p('wind_gusts_10m'))||0, wind:max(p('wind_speed_10m'))||0,
    pSum:sum(p('precipitation')), pMaxH:max(p('precipitation'))||0, prob:max(p('precipitation_probability'))||0,
    storm:codes.some(c=>c>=95), snow:codes.some(c=>(c>=71&&c<=77)||c===85||c===86),
    drizzle:codes.some(c=>c>=51&&c<=57), fog:codes.some(c=>c===45||c===48),
    rhCold:max(rhCold)||0, visMin:vis.length?min(vis):null
  };
}

/* ---------- Regles (convencions del document) ---------- */
function evaluate(m){
  const r={}, add=(k,w)=>{if(!r[k])r[k]=w};
  const f=m.fMin, uv=R(m.uv), g=R(m.gust);
  if(m.uv>3){ if(m.gust>40) add('ulleresVent',`Ràfegues de ${g} km/h i índex UV ${uv}`); else add('ulleresSol',`Índex UV ${uv}`); add('crema',`Índex UV ${uv}`); }
  if((m.uv>5||m.tMax>22)&&f>=5) add('gorra',m.tMax>22?`Màxima de ${R(m.tMax)} °C`:`Índex UV ${uv}`);
  if(m.tMax>22){ add('estiu',`Màxima de ${R(m.tMax)} °C`); add('aigua',`Màxima de ${R(m.tMax)} °C`); }
  if(f>=10&&f<=21) add('tallavent',`Sensació mínima de ${R(f)} °C`);
  if(f>=10&&f<=15) add('manigaLlarga',`Sensació mínima de ${R(f)} °C`);
  if(m.wind>=15&&f>=10) add('tallavent',`Vent de ${R(m.wind)} km/h`);
  if(f<10){ add('termica',`Sensació mínima de ${R(f)} °C`); add('polar',`Sensació mínima de ${R(f)} °C`); add('guants',`Sensació mínima de ${R(f)} °C`); add('bufanda',`Sensació mínima de ${R(f)} °C`); }
  if(f>=5&&f<10) add('softshell',`Sensació mínima de ${R(f)} °C`);
  if(f<5){ add('plomes',`Sensació mínima de ${R(f)} °C`); add('gorro',`Sensació mínima de ${R(f)} °C`); }
  if(f<0){ add('botes','Temperatures sota zero'); add('passamuntanyes','Temperatures sota zero'); }
  if(m.snow){ add('botes','Neu prevista'); add('gorro','Neu prevista'); add('guants','Neu prevista'); }
  if(m.gust>40){ add('ulleresVent',`Ràfegues de ${g} km/h`); if(!r.softshell&&!r.plomes) add('tallavent',`Ràfegues de ${g} km/h`); }
  const heavy=m.pSum>=4||m.pMaxH>=2||m.storm;
  const light=!heavy&&(m.prob>=50||m.pSum>=0.3||m.drizzle);
  const pw=m.storm?'Tempesta prevista':`${m.pSum.toFixed(1)} mm previstos (${R(m.prob)} %)`;
  if(heavy){ add('jaquetaImp',pw); add('pantaloImp',pw); add('funda',pw); }
  else if(light) add('capelina',`Probabilitat de pluja ${R(m.prob)} %`);
  if(m.rhCold>80) add('evitarCoto',`Humitat del ${R(m.rhCold)} % amb fred`);
  if(m.fog||(m.visMin!=null&&m.visMin<1000)){ const w=m.fog?'Boira prevista':`Visibilitat de ${R(m.visMin)} m`; add('frontal',w); add('armilla',w); }
  return Object.keys(ITEMS).filter(k=>r[k]).map(k=>({k,why:r[k]}));
}

/* ---------- Pintar ---------- */
function icon(it){return `<svg viewBox="${it.vb||'0 0 24 24'}">${it.s}</svg>`}
function renderPanel(el,d,di){
  const m=metrics(d,di), list=evaluate(m), D=d.daily;
  el.querySelector('.date').textContent=new Date(D.time[di]+'T12:00').toLocaleDateString('ca-ES',{weekday:'long',day:'numeric',month:'long'});
  el.querySelector('.strip').innerHTML=
    `<span class="chip">${sky(D.weather_code[di],true)}${DESC[D.weather_code[di]]||''}</span>`+
    `<span class="chip">${R(D.temperature_2m_max[di])}° / ${R(D.temperature_2m_min[di])}°</span>`+
    `<span class="chip">${I.drop}${R(D.precipitation_probability_max[di]??0)} % · ${(D.precipitation_sum[di]??0).toFixed(1)} mm</span>`+
    `<span class="chip">${I.wind}${R(D.wind_gusts_10m_max[di]??0)} km/h</span>`+
    `<span class="chip">${I.uv}UV ${R(D.uv_index_max[di]??0)}</span>`;
  const n=Math.max(SLOTS,Math.ceil(list.length/4)*4);
  let h='';
  for(let i=0;i<n;i++){
    const x=list[i];
    if(x){const it=ITEMS[x.k];h+=`<div class="slot on" style="--c:${FAM[it.f]};animation-delay:${i*70}ms" data-why="${x.why}" data-n="${it.n}" title="${it.n}: ${x.why}">${icon(it)}<label${it.n.length>10&&!it.n.includes(' ')?' class="lg"':''}>${it.n}</label></div>`}
    else h+=`<div class="slot"><div class="sock"></div></div>`;
  }
  const sl=el.querySelector('.slots'); sl.innerHTML=h;
  const why=el.querySelector('.why');
  const idle=()=>{ if(list.length){why.className='why';why.style.removeProperty('--c');why.innerHTML=`<span class="dot" style="--c:var(--mut)"></span>${list.length} element${list.length>1?'s':''} a tenir en compte · toca'n un per veure el motiu`} else {why.className='why ok';why.innerHTML='<span class="dot"></span>Condicions suaus: cap precaució especial'} };
  idle();
  sl.querySelectorAll('.slot.on').forEach(s=>s.addEventListener('click',()=>{
    const was=s.classList.contains('sel'); sl.querySelectorAll('.sel').forEach(z=>z.classList.remove('sel'));
    if(was){idle();return}
    s.classList.add('sel'); why.className='why'; why.style.setProperty('--c',s.style.getPropertyValue('--c'));
    why.innerHTML=`<span class="dot"></span><b style="color:${s.style.getPropertyValue('--c')};font-weight:500">${s.dataset.n}</b>&nbsp;· ${s.dataset.why}`;
  }));
}
function renderNow(d){
  const c=d.current, D=d.daily;
  $('#nsky').innerHTML=sky(c.weather_code,c.is_day===1);
  $('#ntemp').innerHTML=`${R(c.temperature_2m)}<sup>°</sup>`;
  $('#ndesc').textContent=DESC[c.weather_code]||'';
  $('#nhour').textContent=`Hora local ${c.time.slice(11,16)}`;
  $('#nhum').textContent=R(c.relative_humidity_2m);
  $('#nfeel').textContent=R(c.apparent_temperature);
  $('#nwind').textContent=R(c.wind_speed_10m);
  $('#tmax').textContent=`${R(D.temperature_2m_max[0])}°`;
  $('#tmin').textContent=`${R(D.temperature_2m_min[0])}°`;
  $('#sunr').textContent=`Sortida ${D.sunrise[0].slice(11,16)}`;
  $('#suns').textContent=`Posta ${D.sunset[0].slice(11,16)}`;
  $('#alt').textContent=`${R(place.elev??d.elevation)} m`;
}

/* ---------- Dades ---------- */
async function load(){
  $('#lname').textContent=place.name; $('#lreg').textContent=place.reg||'\u00a0';
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${place.lat}&longitude=${place.lon}`+
    `&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m`+
    `&hourly=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,uv_index,visibility`+
    `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_gusts_10m_max,uv_index_max,sunrise,sunset`+
    `&timezone=auto&forecast_days=2`;
  try{
    const r=await fetch(u); if(!r.ok) throw 0; const d=await r.json();
    renderNow(d); renderPanel($('#p0'),d,0); renderPanel($('#p1'),d,1);
    $('#foot').innerHTML=`Actualitzat ${new Date().toLocaleTimeString('ca-ES',{hour:'2-digit',minute:'2-digit'})} · Dades: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> · <a href="https://www.bigdatacloud.com" target="_blank" rel="noopener">BigDataCloud</a>`;
  }catch(e){ $('#foot').innerHTML='<span class="err">No s\'han pogut carregar les dades. Es tornarà a provar d\'aquí a uns minuts.</span>'; }
  clearTimeout(timer); timer=setTimeout(load,10*60*1000);
}
async function reverse(lat,lon){
  try{
    const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ca`);
    const j=await r.json();
    return {name:j.city||j.locality||j.principalSubdivision||'La meva ubicació',reg:[j.principalSubdivision,j.countryName].filter(Boolean).join(', ')};
  }catch(e){return {name:'La meva ubicació',reg:''}}
}
function useGPS(){
  store.del('placeManual'); $('#gps').classList.add('on'); $('#q').value='';
  $('#lname').textContent='Localitzant…';
  if(!navigator.geolocation){ place={...DEFAULT}; load(); return; }
  navigator.geolocation.getCurrentPosition(async pos=>{
    const {latitude:lat,longitude:lon}=pos.coords;
    place={lat,lon,...await reverse(lat,lon)}; load();
  },()=>{ place={...DEFAULT}; load(); },{timeout:10000,maximumAge:600000});
}
function choose(p){
  place={lat:p.latitude,lon:p.longitude,name:p.name,reg:[p.admin1,p.country].filter(Boolean).join(', '),elev:p.elevation};
  store.set('placeManual',place); $('#gps').classList.remove('on');
  $('#q').value=''; closeRes(); $('#q').blur(); load();
}

/* ---------- Cercador amb suggeriments ---------- */
let found=[], act=-1, deb=null, reqId=0;
const res=$('#res');
function closeRes(){res.classList.remove('open');act=-1}
function paint(){
  if(!found.length){res.innerHTML='<div class="res none">Cap coincidència</div>';res.classList.add('open');return}
  res.innerHTML=found.map((p,i)=>`<div class="res${i===act?' act':''}" data-i="${i}" role="option"><div><b>${p.name}</b><small>${[p.admin1,p.country].filter(Boolean).join(', ')}${p.elevation!=null?' · '+R(p.elevation)+' m':''}</small></div><span class="cc">${p.country_code||''}</span></div>`).join('');
  res.classList.add('open');
}
res.addEventListener('mousedown',e=>{const el=e.target.closest('.res[data-i]');if(el){e.preventDefault();choose(found[+el.dataset.i])}});
$('#q').addEventListener('input',e=>{
  const q=e.target.value.trim(); clearTimeout(deb);
  if(q.length<2){closeRes();return}
  deb=setTimeout(async()=>{
    const id=++reqId;
    try{
      const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=7&language=ca&format=json`);
      const j=await r.json(); if(id!==reqId) return;
      found=j.results||[]; act=found.length?0:-1; paint();
    }catch(err){}
  },220);
});
$('#q').addEventListener('keydown',e=>{
  if(!res.classList.contains('open')||!found.length) return;
  if(e.key==='ArrowDown'){act=(act+1)%found.length;paint();e.preventDefault()}
  else if(e.key==='ArrowUp'){act=(act-1+found.length)%found.length;paint();e.preventDefault()}
  else if(e.key==='Enter'&&act>=0){choose(found[act]);e.preventDefault()}
  else if(e.key==='Escape') closeRes();
});
$('#q').addEventListener('blur',()=>setTimeout(closeRes,120));
$('#gps').addEventListener('click',useGPS);

/* ---------- Inici ---------- */
const saved=store.get('placeManual');
if(saved){ place=saved; $('#gps').classList.remove('on'); load(); } else useGPS();
</script>
</body>
</html>
